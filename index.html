<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff3d6">
  <title>Shikhi Kids</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🌈 Shikhi Kids</h1>
    <p>খেলতে খেলতে শিখি!</p>
  </header>

  <main>
    <h2>আজ কী শিখবে? 🎈</h2>

    <section class="subjects">
      <button onclick="showLesson('bangla')">
        🇧🇩 বাংলা
      </button>
      <button onclick="showLesson('english')">
        🔤 English
      </button>
      <button onclick="showLesson('math')">
        🔢 গণিত
      </button>
      <button onclick="showLesson('story')">
        📚 গল্প
      </button>
      <button onclick="showLesson('writing')">
        ✍️ লেখা
      </button>
      <button onclick="showLesson('games')">
        🎮 গেম
      </button>
    </section>

    <section id="lesson">
      <h2>স্বাগতম ছোট্ট বন্ধু! 🥰</h2>
      <p>শেখার জন্য উপরের যেকোনো একটি বাটনে চাপ দাও।</p>
    </section>
  </main>

  <footer>
    <p>অভিভাবকদের সহায়তা: support@shikhigamil.com</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>

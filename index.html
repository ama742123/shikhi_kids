
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6C63FF">
  <meta name="description" content="Shikhi Kids — শিশুদের বাংলা, ইংরেজি ও গণিত শেখার আনন্দময় জগৎ">
  <title>Shikhi Kids - শিশুদের শেখার জগৎ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="app-header">
    <div class="brand">
      <div class="brand-logo" aria-hidden="true">📚</div>
      <div>
        <h1>Shikhi Kids</h1>
        <p>শিখি খেলতে খেলতে!</p>
      </div>
    </div>
  </header>

  <main class="app-container">

    <!-- Home top bar -->
    <div class="top-bar" id="topBar">
      <div>
        <h2>হ্যালো ছোট্ট বন্ধু! 👋</h2>
        <p>আজ কী শিখতে চাও?</p>
      </div>

      <div class="top-actions">
        <button type="button" class="icon-button"
          onclick="openChildProfile()" aria-label="শিশুর প্রোফাইল">
          👧
        </button>

        <button type="button" class="icon-button"
          onclick="openSettings()" aria-label="সেটিংস">
          ⚙️
        </button>
      </div>
    </div>

    <!-- Subject buttons -->
    <section id="subjects" class="subjects-section">
      <h2>📚 শেখার বিষয় বেছে নাও</h2>

      <div class="subject-grid">
        <button type="button" class="subject-card"
          onclick="showLesson('bangla')">
          <span class="subject-icon">🔤</span>
          <span>বাংলা</span>
          <small>বর্ণমালা ও শব্দ</small>
        </button>

        <button type="button" class="subject-card"
          onclick="showLesson('rhymes')">
          <span class="subject-icon">🎵</span>
          <span>ছড়া ও গান</span>
          <small>শুনে শুনে শিখি</small>
        </button>

        <button type="button" class="subject-card"
          onclick="showLesson('english')">
          <span class="subject-icon">🔠</span>
          <span>English</span>
          <small>Letters and words</small>
        </button>

        <button type="button" class="subject-card"
          onclick="showLesson('math')">
          <span class="subject-icon">🔢</span>
          <span>গণিত</span>
          <small>সংখ্যা ও হিসাব</small>
        </button>

        <button type="button" class="subject-card"
          onclick="showLesson('story')">
          <span class="subject-icon">📖</span>
          <span>গল্প</span>
          <small>মজার গল্প পড়ি</small>
        </button>

        <button type="button" class="subject-card"
          onclick="showLesson('writing')">
          <span class="subject-icon">✍️</span>
          <span>লেখার অনুশীলন</span>
          <small>লিখতে শিখি</small>
        </button>

        <button type="button" class="subject-card"
          onclick="showLesson('games')">
          <span class="subject-icon">🎮</span>
          <span>শিক্ষামূলক গেম</span>
          <small>খেলতে খেলতে শিখি</small>
        </button>
      </div>
    </section>

    <!-- Lesson and settings content appear here -->
    <section id="lesson" class="lesson-section" aria-live="polite">
      <div class="welcome-card">
        <h2>🌈 শেখার মজার জগতে স্বাগতম!</h2>
        <p>একটি বিষয় বেছে নিয়ে শেখা শুরু করো।</p>
      </div>
    </section>

    <!-- Child profile page -->
    <section id="childProfilePage" hidden>
      <div class="page-heading">
        <h2>👧 শিশুর প্রোফাইল</h2>
        <button type="button" onclick="closeChildProfile()">
          ← ফিরে যাও
        </button>
      </div>

      <form id="childProfileForm" onsubmit="saveChildProfile(event)">
        <label for="childName">শিশুর নাম</label>
        <input
          type="text"
          id="childName"
          name="childName"
          placeholder="শিশুর নাম লিখো"
          maxlength="50"
          required
        >

        <label for="childDob">জন্মতারিখ</label>
        <input
          type="date"
          id="childDob"
          name="childDob"
          onchange="calculateChildAge()"
        >

        <label for="childAge">বয়স</label>
        <input
          type="number"
          id="childAge"
          name="childAge"
          min="3"
          max="8"
          placeholder="বয়স"
          readonly
        >

        <label for="childAgeSelect">অথবা বয়স বেছে নাও</label>
        <select id="childAgeSelect" name="childAgeSelect"
          onchange="document.getElementById('childAge').value=this.value">
          <option value="">বয়স বেছে নাও</option>
          <option value="3">৩ বছর</option>
          <option value="4">৪ বছর</option>
          <option value="5">৫ বছর</option>
          <option value="6">৬ বছর</option>
          <option value="7">৭ বছর</option>
          <option value="8">৮ বছর</option>
        </select>

        <label for="childGender">লিঙ্গ (ঐচ্ছিক)</label>
        <select id="childGender" name="childGender">
          <option value="">বেছে নাও</option>
          <option value="ছেলে">ছেলে</option>
          <option value="মেয়ে">মেয়ে</option>
          <option value="অন্যান্য">অন্যান্য</option>
          <option value="বলতে চাই না">বলতে চাই না</option>
        </select>

        <label for="childPhoto">প্রোফাইল ছবি (ঐচ্ছিক)</label>
        <input
          type="file"
          id="childPhoto"
          name="childPhoto"
          accept="image/*"
          onchange="previewChildPhoto(event)"
        >

        <div class="profile-photo-container">
          <img
            id="childPhotoPreview"
            alt="শিশুর প্রোফাইল ছবির প্রিভিউ"
            hidden
            style="max-width:120px;max-height:120px;object-fit:cover;border-radius:50%;"
          >
        </div>

        <button type="submit" class="primary-button">
          💾 প্রোফাইল সংরক্ষণ করো
        </button>
      </form>

      <div id="savedChildProfile" aria-live="polite"></div>
    </section>

  </main>

  <footer class="app-footer">
    <p>💖 Shikhi Kids — শিখি আনন্দের সঙ্গে</p>
    <p>
      সাহায্যের জন্য:
      <a href="mailto:support.shikhi@gmail.com">
        support.shikhi@gmail.com
      </a>
    </p>
  </footer>

  <!-- Main app JavaScript -->
  <script src="app.js"></script>

  <!-- Settings and navigation -->
  <script>
    const HOME_CONTENT = `
      <div class="welcome-card">
        <h2>🌈 শেখার মজার জগতে স্বাগতম!</h2>
        <p>একটি বিষয় বেছে নিয়ে শেখা শুরু করো।</p>
      </div>
    `;

    function showHomeScreen() {
      document.getElementById("topBar").hidden = false;
      document.getElementById("subjects").hidden = false;
      document.getElementById("lesson").hidden = false;
      document.getElementById("childProfilePage").hidden = true;
      document.getElementById("lesson").innerHTML = HOME_CONTENT;
    }

    function openSettings() {
      document.getElementById("topBar").hidden = true;
      document.getElementById("subjects").hidden = true;
      document.getElementById("childProfilePage").hidden = true;

      const lesson = document.getElementById("lesson");
      lesson.hidden = false;

      lesson.innerHTML = `
        <div class="settings-page">
          <h2>⚙️ সেটিংস</h2>

          <div class="settings-item">
            <label for="toggleDarkMode">🌙 ডার্ক মোড</label>
            <input
              type="checkbox"
              id="toggleDarkMode"
              onchange="toggleDarkMode(this.checked)"
            >
          </div>

          <button type="button" class="settings-button"
            onclick="openParentSection()">
            👨‍👩‍👧 প্যারেন্ট সেকশন
          </button>

          <button type="button" class="settings-button"
            onclick="openPrivacyPolicy()">
            🔒 গোপনীয়তা নীতি
          </button>

          <button type="button" class="settings-button"
            onclick="openAboutApp()">
            📱 অ্যাপ সম্পর্কে
          </button>

          <button type="button" class="settings-button"
            onclick="openAboutDeveloper()">
            👨‍💻 ডেভেলপার সম্পর্কে
          </button>

          <button type="button" class="settings-button"
            onclick="window.location.href='mailto:support.shikhi@gmail.com'">
            ✉️ যোগাযোগ
          </button>

          <button type="button" class="primary-button"
            onclick="showHomeScreen()">
            ← হোমে ফিরে যাও
          </button>
        </div>
      `;

      const darkMode = localStorage.getItem("shikhiKidsDarkMode") === "true";
      document.body.classList.toggle("dark-mode", darkMode);
      document.getElementById("toggleDarkMode").checked = darkMode;
    }

    function closeSettings() {
      showHomeScreen();
    }

    function toggleDarkMode(enabled) {
      document.body.classList.toggle("dark-mode", enabled);
      localStorage.setItem("shikhiKidsDarkMode", String(enabled));

      const themeColor = document.querySelector('meta[name="theme-color"]');
      if (themeColor) {
        themeColor.setAttribute("content", enabled ? "#202124" : "#6C63FF");
      }
    }

    function openSettingsPageContent(title, content) {
      const lesson = document.getElementById("lesson");

      lesson.innerHTML = `
        <div class="settings-page">
          <h2>${title}</h2>
          <div class="settings-content">${content}</div>
          <button type="button" class="primary-button"
            onclick="openSettings()">
            ← সেটিংসে ফিরে যাও
          </button>
        </div>
      `;
    }

    function openParentSection() {
      openSettingsPageContent(
        "👨‍👩‍👧 প্যারেন্ট সেকশন",
        `
          <p>শিশুকে শেখার সময় সাহায্য করুন এবং তার অগ্রগতি দেখুন।</p>
          <p>শিশুর নিরাপত্তার জন্য ব্যক্তিগত তথ্য অনলাইনে শেয়ার করবেন না।</p>
          <p>এই সংস্করণে অনলাইন অভিভাবক যাচাইকরণ বা ক্লাউড সিঙ্ক নেই।</p>
        `
      );
    }

    function openPrivacyPolicy() {
      openSettingsPageContent(
        "🔒 গোপনীয়তা নীতি",
        `
          <p>Shikhi Kids শিশুদের শেখার জন্য তৈরি একটি শিক্ষামূলক অ্যাপ।</p>
          <p>প্রোফাইলের তথ্য এই ডিভাইসে সংরক্ষিত হতে পারে।</p>
          <p>প্রোফাইল ছবি বেছে নিলেই তা ইন্টারনেটে আপলোড হয় না।</p>
          <p>অন্য কোনো সেবা যুক্ত করা হলে তার তথ্য সংগ্রহের নিয়ম আলাদাভাবে জানাতে হবে।</p>
        `
      );
    }

    function openAboutApp() {
      openSettingsPageContent(
        "📱 Shikhi Kids সম্পর্কে",
        `
          <p>Shikhi Kids শিশুদের আনন্দের সঙ্গে শেখার একটি অ্যাপ।</p>
          <p>বিষয়: বাংলা, ইংরেজি, গণিত, ছড়া, গল্প, লেখার অনুশীলন ও গেম।</p>
          <p>বয়স: ৩–৮ বছর।</p>
        `
      );
    }

    function openAboutDeveloper() {
      openSettingsPageContent(
        "👨‍💻 ডেভেলপার সম্পর্কে",
        `
          <p><strong>নাম:</strong> aman</p>
          <p><strong>অবস্থান:</strong> West Bengal, India</p>
          <p><strong>সহায়তা:</strong>
            <a href="mailto:support.shikhi@gmail.com">
              support.shikhi@gmail.com
            </a>
          </p>
        `
      );
    }

    // Restore the saved appearance preference.
    (function restoreTheme() {
      const enabled = localStorage.getItem("shikhiKidsDarkMode") === "true";
      document.body.classList.toggle("dark-mode", enabled);

      const themeColor = document.querySelector('meta[name="theme-color"]');
      if (themeColor) {
        themeColor.setAttribute("content", enabled ? "#202124" : "#6C63FF");
      }
    })();
  </script>

</body>
</html>
